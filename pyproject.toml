[project]
name = "alpaca-bots"
version = "0.1.0"
description = "Three Alpaca paper-trading bots (ORB, Insider Filings, Futures Reversal) with Claude-written strategy/risk code and Jev as the live decision layer."
requires-python = ">=3.10"
dependencies = [
    "alpaca-py>=0.33.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "apscheduler>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alpaca_bots"]
